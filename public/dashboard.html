<title>خَلِيّة</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');

  :root{
    --bg:#FBF7EF;
    --surface:#FFFFFF;
    --surface-2:#F4ECDA;
    --surface-3:#EFE4CC;
    --border:#E6DBC2;
    --border-soft:#EFE7D5;
    --text:#1B2340;
    --text-2:#4B5273;
    --muted:#8A8FA8;
    --accent:#C9932E;
    --accent-strong:#A6741F;
    --accent-soft:#F3E0AD;
    --accent-tint:#FBF2DC;
    --on-accent:#2A1C04;
    --good:#25925B;
    --good-soft:#DCEFE2;
    --good-strong:#166B41;
    --risk:#BD4B45;
    --risk-soft:#F7E0DD;
    --risk-strong:#8F332E;
    --alert:#CC7A2E;
    --alert-soft:#FAE6CE;
    --alert-strong:#9C5C1E;
    --info:#3C6690;
    --info-soft:#DEE9F1;
    --shadow:0 1px 2px rgba(27,35,64,.04), 0 8px 24px -12px rgba(27,35,64,.12);
    --shadow-lg:0 12px 40px -16px rgba(27,35,64,.28);
    --radius:16px;
    --radius-sm:10px;
    --font-display:'El Messiri',ui-sans-serif,'Segoe UI',Tahoma,sans-serif;
    --font-body:'IBM Plex Sans Arabic',ui-sans-serif,'Segoe UI',Tahoma,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12162A;
      --surface:#1A2036;
      --surface-2:#212844;
      --surface-3:#293154;
      --border:#333D63;
      --border-soft:#2A3252;
      --text:#F1EFE6;
      --text-2:#C2C6DE;
      --muted:#8B90AD;
      --accent:#E3B458;
      --accent-strong:#F0C877;
      --accent-soft:#4A3B18;
      --accent-tint:#2A2413;
      --on-accent:#241900;
      --good:#4CBE86;
      --good-soft:#173627;
      --good-strong:#7BD6A5;
      --risk:#E38079;
      --risk-soft:#3C2222;
      --risk-strong:#F3A9A3;
      --alert:#E3A15E;
      --alert-soft:#3A2A14;
      --alert-strong:#F0BC8A;
      --info:#7FAAD1;
      --info-soft:#1E2E3F;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      --shadow-lg:0 20px 60px -20px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12162A;
    --surface:#1A2036;
    --surface-2:#212844;
    --surface-3:#293154;
    --border:#333D63;
    --border-soft:#2A3252;
    --text:#F1EFE6;
    --text-2:#C2C6DE;
    --muted:#8B90AD;
    --accent:#E3B458;
    --accent-strong:#F0C877;
    --accent-soft:#4A3B18;
    --accent-tint:#2A2413;
    --on-accent:#241900;
    --good:#4CBE86;
    --good-soft:#173627;
    --good-strong:#7BD6A5;
    --risk:#E38079;
    --risk-soft:#3C2222;
    --risk-strong:#F3A9A3;
    --alert:#E3A15E;
    --alert-soft:#3A2A14;
    --alert-strong:#F0BC8A;
    --info:#7FAAD1;
    --info-soft:#1E2E3F;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --shadow-lg:0 20px 60px -20px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  html{color-scheme:light dark}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--font-body);direction:rtl;text-align:right;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;color:var(--text)}
  p{margin:0}
  button{font-family:inherit}
  ::selection{background:var(--accent-soft);color:var(--on-accent)}
  a{color:inherit}
  .num{font-variant-numeric:tabular-nums}
  .ic{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ic svg{width:1em;height:1em;stroke:currentColor;display:block}

  /* ---------- App shell ---------- */
  .app{display:flex;min-height:100vh}
  .sidebar{
    width:264px;flex:0 0 264px;background:var(--surface);
    border-left:1px solid var(--border-soft);
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px}
  .brand-mark{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:linear-gradient(155deg,var(--accent),var(--accent-strong));display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
  .brand-mark svg{width:21px;height:21px;stroke:var(--on-accent)}
  .brand-name{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1}
  .brand-tag{font-size:11px;color:var(--muted);margin-top:3px}

  .nav{padding:6px 12px 20px;display:flex;flex-direction:column;gap:2px}
  .nav-label{font-size:11px;color:var(--muted);padding:14px 10px 6px;letter-spacing:.02em}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;
    color:var(--text-2);font-size:13.5px;font-weight:500;cursor:pointer;border:none;background:none;
    text-align:right;width:100%;
  }
  .nav-item svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor}
  .nav-item:hover{background:var(--surface-2);color:var(--text)}
  .nav-item.active{background:var(--accent-tint);color:var(--accent-strong);font-weight:600}
  .nav-item.active svg{stroke:var(--accent-strong)}
  .nav-sub{padding-inline-start:8px;display:flex;flex-direction:column;gap:1px;margin-top:2px;margin-bottom:4px}
  .nav-sub .nav-item{font-size:12.8px;padding:7px 10px 7px 10px}
  .nav-sub .nav-item .dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}

  .topbar{
    position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--border-soft);
    display:flex;align-items:center;gap:14px;padding:14px 26px;backdrop-filter:blur(6px);
  }
  .search{
    flex:1;max-width:360px;display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:9px 12px;color:var(--muted);
  }
  .search svg{width:15px;height:15px;stroke:var(--muted);flex:0 0 15px}
  .search input{border:none;outline:none;background:none;color:var(--text);font-size:13px;width:100%;font-family:inherit}
  .topbar-spacer{flex:1}
  .sync-pill{display:flex;align-items:center;gap:7px;background:var(--good-soft);color:var(--good-strong);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
  .sync-pill .blip{width:7px;height:7px;border-radius:50%;background:var(--good);animation:blip 2.2s infinite}
  @keyframes blip{0%,100%{opacity:1}50%{opacity:.35}}
  .qa-flash{animation:qaFlash 1.8s ease}
  @keyframes qaFlash{0%{box-shadow:0 0 0 3px var(--accent-tint);border-color:var(--accent-soft)}70%{box-shadow:0 0 0 3px var(--accent-tint);border-color:var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
  #meetingMicBtn.mic-active{background:var(--risk-soft);color:var(--risk);border-color:var(--risk-soft);animation:micPulse 1.2s ease-in-out infinite}
  @keyframes micPulse{0%,100%{box-shadow:0 0 0 0 var(--risk-soft)}50%{box-shadow:0 0 0 7px transparent}}
  .meeting-chat::-webkit-scrollbar{width:6px}
  .meeting-chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--text-2)}
  .icon-btn svg{width:16px;height:16px;stroke:currentColor}
  .icon-btn:hover{background:var(--surface-2);color:var(--text)}
  .badge-dot{position:absolute;top:-3px;left:-3px;width:9px;height:9px;border-radius:50%;background:var(--risk);border:2px solid var(--bg)}
  .user-chip{display:flex;align-items:center;gap:9px;padding:5px 6px 5px 12px;border-radius:12px;cursor:pointer}
  .user-chip:hover{background:var(--surface-2)}
  .avatar{width:32px;height:32px;border-radius:9px;background:linear-gradient(155deg,var(--info),#2C4A69);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;font-family:var(--font-display)}
  .user-meta .u-name{font-size:12.5px;font-weight:600}
  .user-meta .u-store{font-size:11px;color:var(--muted)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .view{padding:24px 26px 60px;max-width:1280px;width:100%;margin:0 auto}
  .view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .view-title{font-size:24px;font-weight:700}
  .view-sub{color:var(--text-2);font-size:13.5px;margin-top:4px;max-width:60ch}
  .eyebrow{font-size:11.5px;color:var(--accent-strong);font-weight:700;letter-spacing:.03em;margin-bottom:6px}

  /* ---------- primitives ---------- */
  .card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-pad{padding:18px}
  .grid{display:grid;gap:14px}
  .g-4{grid-template-columns:repeat(4,1fr)}
  .g-3{grid-template-columns:repeat(3,1fr)}
  .g-2{grid-template-columns:repeat(2,1fr)}
  @media (max-width:1080px){.g-4{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:680px){.g-4,.g-3,.g-2{grid-template-columns:1fr}}

  /* ---------- decision-first overview ---------- */
  .ov-grid{display:grid;grid-template-columns:2.1fr 1fr;gap:16px;align-items:start}
  @media (max-width:1000px){.ov-grid{grid-template-columns:1fr}}
  .ov-strip{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .ov-strip .div-v{width:1px;align-self:stretch;background:var(--border-soft)}
  .mini-metric{display:flex;flex-direction:column;gap:2px}
  .mini-metric .l{font-size:11px;color:var(--muted)}
  .mini-metric .v{font-size:15px;font-weight:700;font-family:var(--font-display)}
  .pulse-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-soft);border:1px solid var(--border-soft);border-radius:12px;overflow:hidden}
  .pulse-stat{background:var(--surface);padding:12px 10px;text-align:center}
  .pulse-stat .v{font-family:var(--font-display);font-size:19px;font-weight:700}
  .pulse-stat .l{font-size:10.5px;color:var(--muted);margin-top:3px}
  .dq-card{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px;flex-wrap:wrap}
  .dq-main{display:flex;gap:13px;flex:1;min-width:260px}
  .dq-icon{width:42px;height:42px;flex:0 0 42px}
  .dq-body{flex:1;min-width:0}
  .dq-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .dq-title{font-size:14.5px;font-weight:700;line-height:1.5;margin-bottom:4px}
  .dq-desc{font-size:12.5px;color:var(--text-2);line-height:1.75;margin-bottom:8px}
  .dq-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
  .dq-actions{display:flex;gap:7px;flex:0 0 auto}
  @media (max-width:620px){.dq-card{flex-direction:column;align-items:stretch}.dq-actions{justify-content:flex-end}}

  .leader-hero{background:linear-gradient(135deg,var(--accent-tint),var(--surface) 65%);border-color:var(--accent-soft);padding:22px 24px;margin-bottom:18px}
  .leader-hero-top{display:flex;align-items:center;gap:13px;margin-bottom:12px}
  .leader-avatar{width:50px;height:50px;flex:0 0 50px;background:linear-gradient(155deg,var(--accent),var(--accent-strong));color:var(--on-accent);box-shadow:var(--shadow)}
  .leader-avatar svg{width:24px;height:24px}
  .leader-name{font-family:var(--font-display);font-weight:700;font-size:16.5px}
  .leader-sub{font-size:12px;color:var(--muted);margin-top:1px}
  .leader-ring{position:relative;width:50px;height:50px;flex:0 0 auto;margin-inline-start:auto;display:flex;align-items:center;justify-content:center}
  .leader-ring-val{position:absolute;font-family:var(--font-display);font-weight:700;font-size:14px}
  .leader-msg{display:flex;flex-direction:column;gap:7px;font-size:14px;line-height:2;color:var(--text-2);max-width:76ch}
  .leader-msg b{color:var(--text);font-weight:700}
  .leader-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  @media (max-width:560px){.leader-hero-top{flex-wrap:wrap}.leader-ring{margin-inline-start:0}}

  .ov-lead-msg{display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:2;color:var(--text-2);max-width:74ch}
  .ov-lead-msg b{color:var(--text)}
  .leader-combo{display:flex;gap:26px;align-items:stretch}
  .leader-combo-main{flex:2.1;min-width:0}
  .leader-combo-div{width:1px;align-self:stretch;background:var(--accent-soft)}
  .leader-combo-side{flex:1;min-width:250px;display:flex;flex-direction:column;justify-content:center}
  @media (max-width:860px){.leader-combo{flex-direction:column}.leader-combo-div{display:none}}

  .org-chart{padding:22px 24px 20px}
  .org-welcome{text-align:center;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border-soft)}
  .org-welcome-title{font-size:23px;font-weight:800;color:var(--text);margin-bottom:10px;line-height:1.5}
  .org-welcome-title b{color:var(--accent-strong)}
  .org-welcome-sub{font-size:14.5px;color:var(--text-2);line-height:2;max-width:700px;margin:0 auto}
  .org-leader{display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:14px}
  .org-avatar{border-radius:50%;overflow:hidden;background:var(--surface-2);flex:0 0 auto;border:3px solid var(--border)}
  .org-avatar img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .org-avatar-leader{width:108px;height:108px;border-width:4px;border-color:var(--accent-strong);box-shadow:0 0 0 6px var(--accent-tint)}
  .org-leader-name{font-weight:700;font-size:15.5px;margin-top:8px}
  .org-leader-role{font-size:11.5px;color:var(--muted)}
  .org-connector-main{width:2px;height:22px;background:var(--border);margin:0 auto}
  .org-managers{display:grid;grid-template-columns:repeat(5,1fr);gap:20px 8px;justify-items:center;position:relative;padding-top:16px}
  .org-managers::before{content:'';position:absolute;top:0;left:12%;right:12%;height:2px;background:var(--border)}
  .org-manager{display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;max-width:110px}
  .org-connector-branch{width:2px;height:14px;background:var(--border)}
  .org-avatar-manager{width:64px;height:64px}
  .org-manager-name{font-size:10.8px;text-align:center;line-height:1.5;color:var(--text-2)}
  .org-manager-name b{display:block;font-size:11.5px;color:var(--text);font-weight:700}
  @media (max-width:900px){.org-managers{grid-template-columns:repeat(4,1fr)}}
  @media (max-width:640px){.org-managers{grid-template-columns:repeat(3,1fr)}.org-managers::before{left:5%;right:5%}}
  @media (max-width:420px){.org-managers{grid-template-columns:repeat(2,1fr)}}

  .cm-card{padding:20px;display:flex;flex-direction:column;gap:10px}
  .cm-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .cm-title{font-size:15px;font-weight:700}
  .cm-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .cm-avatar{width:38px;height:38px;flex:0 0 38px}
  .cm-body{font-size:13px;line-height:1.95;color:var(--text-2)}
  .cm-actions{display:flex;gap:8px;margin-top:2px;flex-wrap:wrap}

  /* ---------- council: compact vote layout ---------- */
  .council-result-head{text-align:center;margin:6px 0 20px}
  .council-columns{display:grid;grid-template-columns:1.9fr 1fr;gap:18px;align-items:start}
  @media (max-width:960px){.council-columns{grid-template-columns:1fr}}
  .council-left{padding:20px}
  .vote-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:4px}
  @media (max-width:680px){.vote-grid{grid-template-columns:1fr}}
  .vote-card{border:1px solid var(--border-soft);border-radius:14px;padding:16px;text-align:center;position:relative;background:var(--surface-2)}
  .vote-card .vc-icon{position:absolute;top:12px;left:12px;font-size:19px;line-height:1}
  .vote-card .vc-name{font-weight:700;font-size:13.5px;margin-bottom:8px;padding-inline-end:38px}
  .vote-card .vc-highlight{font-size:12px;color:var(--text-2);line-height:1.7;margin:10px 0}
  .vote-card .vc-conf{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;margin-top:6px;color:var(--text-2)}
  .vote-connector{height:22px;position:relative}
  .vote-connector svg{width:100%;height:100%}
  .vote-bottom-row{display:grid;grid-template-columns:1fr 1.5fr;gap:12px;margin-top:6px}
  .vote-oppose-box{border:1px dashed var(--border);border-radius:12px;padding:12px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;min-height:52px}
  .vote-oppose-box.has-oppose{border-style:solid;border-color:var(--risk-soft);color:var(--risk-strong);flex-direction:column;gap:6px}
  .vote-details-btn{border:1px solid var(--accent-soft);background:var(--accent-tint);color:var(--accent-strong);border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;min-height:52px}
  .vote-details-btn:hover{background:var(--accent-soft)}
  .leader-verdict{padding:20px;position:relative}
  .lv-bookmark{position:absolute;top:18px;left:18px;width:30px;height:30px;border:1px solid var(--border);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--accent-strong)}
  .lv-title{font-size:14px;font-weight:700;padding-inline-end:38px}
  .lv-headline{font-size:16px;font-weight:700;line-height:1.7;margin:12px 0 14px}
  .lv-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .lv-stat{text-align:center;padding:10px 6px;background:var(--surface-2);border-radius:10px}
  .lv-stat .v{font-family:var(--font-display);font-weight:700;font-size:14px;line-height:1.4}
  .lv-stat .l{font-size:10px;color:var(--muted);margin-top:3px}
  .lv-agree{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:700;background:var(--good-soft);color:var(--good-strong);border-radius:10px;padding:9px;margin-bottom:6px}
  .lv-agree svg{width:15px;height:15px}
  .lv-risk-row{display:flex;align-items:flex-start;gap:7px;font-size:11.5px;color:var(--text-2);line-height:1.7;padding:9px 0;border-top:1px solid var(--border-soft)}
  .lv-risk-row .ic{color:var(--alert-strong);margin-top:1px}
  .lv-actions{display:flex;gap:6px;margin-top:14px}
  .lv-actions .btn{flex:1;padding:9px 6px}

  .btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap}
  .btn svg{width:14px;height:14px;stroke:currentColor}
  .btn-primary{background:var(--accent);color:var(--on-accent)}
  .btn-primary:hover{background:var(--accent-strong)}
  .btn-ghost{background:var(--surface);color:var(--text-2);border-color:var(--border)}
  .btn-ghost:hover{background:var(--surface-2);color:var(--text)}
  .btn-good{background:var(--good);color:#fff}
  .btn-good:hover{background:var(--good-strong)}
  .btn-risk{background:transparent;color:var(--risk);border-color:var(--risk-soft)}
  .btn-risk:hover{background:var(--risk-soft)}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;line-height:1.4}
  .chip-good{background:var(--good-soft);color:var(--good-strong)}
  .chip-risk{background:var(--risk-soft);color:var(--risk-strong)}
  .chip-alert{background:var(--alert-soft);color:var(--alert-strong)}
  .chip-accent{background:var(--accent-tint);color:var(--accent-strong)}
  .chip-info{background:var(--info-soft);color:var(--info)}
  .chip-muted{background:var(--surface-2);color:var(--text-2)}
  .chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}

  .kpi{display:flex;flex-direction:column;gap:8px}

  };
  const ids = pickMap[question] || ['profit','customers','quality'];

    return { cellId:id, stance:stances[i], highlight:`${c.kpis[0].label}: ${c.kpis[0].value}`, text:c.insight, evidence:c.sources.map(s=>'بيانات من: '+s),

      impact:Math.round(8000+Math.random()*15000), confidence:60+Math.floor(Math.random()*22), conditions:[], alternative:null };
  });
  const avgConf = Math.round(opinions.reduce((a,o)=>a+o.confidence,0)/opinions.length);
  return { subtitle:'تحليل أولي مبني على بيانات الخلايا ذات الصلة', opinions,
    verdict:{ decision:'دراسة القرار ضمن نطاق محدود قبل التنفيذ الكامل، بالتنسيق بين '+ids.map(i=>CELL(i).name).join('، '),

    credentials: 'same-origin',
    body: options.body!==undefined ? JSON.stringify(options.body) : undefined,
  });
  if(res.status===401){ location.href = '/login'; throw new Error('unauthorized'); }
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){ throw Object.assign(new Error(data.error || 'حدث خطأ غير متوقع'), {status:res.status, data}); }
  return data;
}

function formatRelativeArabic(iso){
  if(!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 1) return 'الآن';
  if(mins < 60) return `قبل ${mins} دقيقة`;
  const hours = Math.floor(mins/60);
  if(hours < 24) return `قبل ${hours} ساعة`;
  const days = Math.floor(hours/24);
  return `قبل ${days} يوم`;
}

function sparkline(points, colorVar='accent', h=64){
  const w = 260;
  const vals = points.map(p=>p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min)||1;
  const stepX = w/(points.length-1);
  const pad = 6;
  const coords = points.map((p,i)=>{
    const x = i*stepX;
    const y = pad + (1-( (p.v-min)/range ))*(h-pad*2);
    return [x,y];
  });
  const line = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const area = line + ` L${w},${h} L0,${h} Z`;
  const last = coords[coords.length-1];
  const id = 'sg'+Math.random().toString(36).slice(2,8);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="overflow:visible">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--${colorVar})" stop-opacity=".28"/>
      <stop offset="100%" stop-color="var(--${colorVar})" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id})" stroke="none"/>
    <path d="${line}" fill="none" stroke="var(--${colorVar})" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.4" fill="var(--${colorVar})"/>
  </svg>`;
}
function barsChart(points, colorVar='accent', h=110){
  const max = Math.max(...points.map(p=>p.v))*1.15 || 1;
  return `<div style="display:flex;align-items:flex-end;gap:8px;height:${h}px">
    ${points.map(p=>`
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
        <div class="num" style="font-size:10.5px;color:var(--text-2)">${p.v}</div>
        <div style="width:100%;max-width:34px;height:${Math.max(6,(p.v/max)*(h-30))}px;border-radius:7px 7px 3px 3px;background:var(--${colorVar})"></div>
        <div style="font-size:10.5px;color:var(--muted);white-space:nowrap">${p.l}</div>
      </div>`).join('')}
  </div>`;
}
function scoreRing(score, size=64, colorVar='good'){
  const r = (size-8)/2, c = 2*Math.PI*r;
  const off = c*(1-score/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--${colorVar})" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg>`;
}

  if(!t){ t = document.createElement('div'); t.id='toast';

function updateDecisionStatus(id, status){
  const d = DECISION(id); if(!d) return;

  router();
  const enumStatus = DECISION_STATUS_TO_ENUM[status];
  if(enumStatus){
    api(`/api/decisions/${id}/status`, {method:'POST', body:{status:enumStatus}}).catch(err=>{
      d.status = prevStatus; toast('تعذّر حفظ حالة القرار — حاول مرة أخرى'); router();
    });
  }
}

function renderOverview(){
  const health = Math.round(CELLS.reduce((a,c)=>a+c.score,0)/CELLS.length);
  const ovFilter = STATE.ovFilter || 'الكل';
  const allPending = DECISIONS.filter(d=>d.status==='ينتظر الموافقة');
  let pending = ovFilter==='الكل' ? allPending : allPending.filter(d=>d.category===ovFilter);
  pending = [...pending].sort((a,b)=> (PRIORITY_WEIGHT[a.category]-PRIORITY_WEIGHT[b.category]) || (b.confidence-a.confidence));
  const inProgress = DECISIONS.filter(d=>d.status==='قيد التنفيذ').length;
  const succeeded = DECISIONS.filter(d=>['نجح','تم التنفيذ'].includes(d.status)).length;
  const failed = DECISIONS.filter(d=>['لم يحقق النتيجة','مرفوض'].includes(d.status)).length;
  const risks = DECISIONS.filter(d=>d.category==='عاجل'||d.category==='تحذير').slice(0,3);
  const opportunities = DECISIONS.filter(d=>d.category==='فرصة').slice(0,3);
  const executed = DECISIONS.filter(d=>['تم التنفيذ','نجح','لم يحقق النتيجة'].includes(d.status)).slice(0,3);

  const urgentCount = allPending.filter(d=>d.category==='عاجل').length;
  const oppCount = allPending.filter(d=>d.category==='فرصة').length;
  const topItem = [...allPending].sort((a,b)=>(PRIORITY_WEIGHT[a.category]-PRIORITY_WEIGHT[b.category])||(b.confidence-a.confidence))[0];
  const summaryLine = topItem
    ? `اليوم رصدت الخلايا ${urgentCount?`<b>${urgentCount}</b> أمراً عاجلاً`:'عدة أمور تستحق نظرك'}${oppCount?` و<b>${oppCount}</b> فرصة`:''}، أبرزها «${topItem.title}».`
    : `لا توجد اليوم أمور عاجلة تستحق نظرك — كل شيء تحت السيطرة.`;

  return `
    <div class="card org-chart">
      <div class="org-welcome">
        <div class="org-welcome-title">صباح الخير، سيّد <b>عبدالإله</b>… أسعد الله صباحك ونوّرتنا!</div>
        <p class="org-welcome-sub">قادة الخلايا ومديروها سعداء برؤيتك اليوم. يمكنك الآن استعراض الملخّص اليومي لكل خلية، ومراجعة القرارات التي دُرست بالتعاون بين الخلايا المعنية، أو طرح قرار جديد؛ لتجتمع الخلايا المختصة، وتوافيك بخلاصة الدراسة وأفضل التوصيات.</p>
      </div>
      <div class="org-leader">
        <div class="org-avatar org-avatar-leader"><img src="${AVATARS.leader}" alt="قائد الخلايا"/></div>
        <div class="org-leader-name">قائد الخلايا</div>
        <div class="org-leader-role">المساعد التنفيذي للمتجر</div>
      </div>
      <div class="org-connector-main"></div>
      <div class="org-managers">
        ${CELLS.map(c=>`
        <div class="org-manager" onclick="location.hash='#cells/${c.id}'" style="cursor:pointer">
          <div class="org-connector-branch"></div>
          <div class="org-avatar org-avatar-manager" style="border-color:var(--${c.color})">${AVATARS[c.id] ? `<img src="${AVATARS[c.id]}" alt="${c.name}"/>` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--${c.color}-soft);color:var(--${c.color})">${icon(c.icon)}</div>`}</div>
          <div class="org-manager-name">مدير<br/><b>${c.name.replace('خلية ','')}</b></div>
        </div>`).join('')}
      </div>
    </div>

    <div class="card leader-hero">
      <div class="leader-combo">
        <div class="leader-combo-main">
          <h1 class="view-title" style="margin-bottom:3px">قائد الخلايا</h1>
          <div style="font-size:12.5px;color:var(--muted);margin-bottom:14px">المساعد التنفيذي للتاجر</div>
          <div class="ov-lead-msg">
            <div>${getGreeting()} عبدالإله، معك قائد الخلايا العاملة.</div>
            <div>${summaryLine}</div>
            <div>الصحة العامة للمتجر حالياً <b class="num" style="color:var(--${scoreColor(health)})">${health} من 100</b> — ${healthWord(health)}، وأرباحنا منذ بداية الشهر <b class="num" style="color:var(--good-strong)">186,420 ر.س</b>.</div>
          </div>
        </div>

        <div class="leader-combo-div"></div>

        <div class="leader-combo-side">
          <div class="section-title" style="margin-bottom:12px"><span>ملخص القرارات</span></div>
          <div class="pulse-stats" style="margin-bottom:14px">
            <div class="pulse-stat"><div class="v num" style="color:var(--info)">${allPending.length}</div><div class="l">تنتظر الموافقة</div></div>
            <div class="pulse-stat"><div class="v num" style="color:var(--accent-strong)">${inProgress}</div><div class="l">قيد التنفيذ</div></div>
            <div class="pulse-stat"><div class="v num" style="color:var(--good-strong)">${succeeded}</div><div class="l">نجحت</div></div>
            <div class="pulse-stat"><div class="v num" style="color:var(--risk-strong)">${failed}</div><div class="l">لم تحقق النتيجة</div></div>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost" style="flex:1;background:var(--surface)" onclick="location.hash='#decisions'">عرض القرارات</button>
            <button class="btn btn-ghost" style="flex:1;background:var(--surface)" onclick="location.hash='#council'">المجلس الاستشاري</button>
          </div>
        </div>
      </div>
      ${askLeaderQuickBlock('leader')}
    </div>

    <div class="section-title"><span>${icon('grid')} ملخصات مديري الخلايا</span></div>
    <div style="display:flex;flex-direction:column;gap:14px">
      ${CELLS.map(c=>cellManagerCard(c)).join('')}
    </div>
  `;
}

/* ---------------- صفحة: قائد الخلية ---------------- */
const LEADER_QA = [
  {q:'ما الأولوية اليوم؟', a:'الأولوية المقترحة هي معالجة سرعة صفحة الدفع على الجوال، لأن أثرها يشمل جميع مصادر المبيعات وليس قناة واحدة فقط.'},
  {q:'هل هناك تعارض بين الخلايا؟', a:'نعم، خلية الإعلان والتسويق تقترح زيادة ميزانية حملة «العناية بالبشرة» بنسبة 25% بناءً على أداء واعد، بينما ترى خلية جودة القرار والأثر أن البيانات المتوفرة أسبوع واحد فقط وغير كافية لاتخاذ قرار بثقة. المقترح: الانتظار حتى اكتمال 14 يوماً من البيانات قبل رفع الميزانية.'},
  {q:'كم قراراً ينتظر موافقتي؟', a:'هناك ' + DECISIONS.filter(d=>d.status==='ينتظر الموافقة').length + ' قرارات تنتظر موافقتك حالياً، أبرزها إعادة طلب مخزون سيروم فيتامين C لأنه الأعلى تأثيراً على المبيعات.'},
];
function renderLeader(){
  const ranked = [...DECISIONS].filter(d=>d.status==='ينتظر الموافقة').sort((a,b)=> (b.confidence*Math.abs(b.impact||1)) - (a.confidence*Math.abs(a.impact||1)) ).slice(0,6);
  const conflicts = DECISIONS.filter(d=>d.oppose.length>0);

const MEETING_QUICK_TOPICS = [

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function toggleMeetingParticipant(id){

}
function rerenderMeeting(){

function meetingBubble(msg){
  const text = escapeHtml(msg.text);
  if(msg.who==='user'){
    return `<div style="align-self:flex-end;max-width:78%;background:var(--surface-2);border-radius:12px 12px 3px 12px;padding:9px 13px;font-size:13px;line-height:1.8">${text}</div>`;

      </div>

  if(!c) return '';
  return `<div style="align-self:flex-start;max-width:85%;display:flex;gap:8px">
    <div class="avatar-cell" style="width:28px;height:28px;flex:0 0 28px;background:var(--${c.color}-soft);color:var(--${c.color})">${icon(c.icon)}</div>
    <div>
      <div style="font-size:10.5px;color:var(--muted);margin-bottom:3px">مدير ${c.name}</div>

function meetingRespond(text){
  const p = STATE.meeting.participants;
  const matched = CELLS.filter(c=> p[c.id] && (MEETING_TOPIC_KEYWORDS[c.id]||[]).some(k=>text.includes(k))).slice(0,3);
  const msgs = [];
  if(matched.length){
    msgs.push({who:'leader', text:`موضوع وجيه، دعني أنسّق الرد مع ${matched.map(c=>'خلية '+c.name).join('، ')}.`});
    matched.forEach(c=> msgs.push({who:c.id, text:c.insight}));
    msgs.push({who:'leader', text:`الخلاصة: بالتنسيق مع ${matched.map(c=>c.name).join('، ')}، أقترح دراسة هذا الموضوع كقرار رسمي عبر المجلس الاستشاري، أو يمكنني إضافته مباشرة إلى قائمة القرارات المعلّقة إن أردت.`});
  } else {
    msgs.push({who:'leader', text:'وصلني موضوعك. لا توجد حالياً خلية مفعّلة في هذا الاجتماع لديها بيانات مباشرة عنه، لكن يمكنني تكوين رأي مبدئي بناءً على الصورة العامة للمتجر إن رغبت، أو فعّل خلية معينة من قائمة الأعضاء أعلاه وسأطلب رأيها مباشرة.'});
  }
  return msgs;
}
function persistMeetingMessage(msg){
  const role = msg.who==='user' ? 'MERCHANT' : msg.who==='leader' ? 'LEADER' : 'CELL';
  const cellSlug = role==='CELL' ? msg.who : undefined;
  api('/api/meeting/messages', {method:'POST', body:{role, cellSlug, text:msg.text}}).catch(()=>{});
}
function sendMeetingMessage(preset){
  const input = document.getElementById('meetingInput');
  const val = (preset!=null ? String(preset) : (input?input.value:'')).trim();
  if(!val) return;
  const userMsg = {who:'user', text:val};
  STATE.meeting.messages.push(userMsg);
  persistMeetingMessage(userMsg);
  const chat = document.getElementById('meetingChat');
  if(chat){ chat.insertAdjacentHTML('beforeend', meetingBubble(userMsg)); chat.scrollTop = chat.scrollHeight; }
  if(input) input.value = '';
  setTimeout(()=>{
    const replies = meetingRespond(val);
    replies.forEach(r=>{
      STATE.meeting.messages.push(r);
      persistMeetingMessage(r);
      if(chat){ chat.insertAdjacentHTML('beforeend', meetingBubble(r)); chat.scrollTop = chat.scrollHeight; }
    });
  }, 500);
}
let meetingRecognition = null;
function toggleMeetingMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('التعرف الصوتي غير مدعوم في هذا المتصفح'); return; }
  const btn = document.getElementById('meetingMicBtn');
  const status = document.getElementById('meetingMicStatus');
  if(meetingRecognition){ meetingRecognition.stop(); return; }
  try{
    meetingRecognition = new SR();
    meetingRecognition.lang = 'ar-SA';
    meetingRecognition.interimResults = true;
    meetingRecognition.continuous = false;
    meetingRecognition.onstart = ()=>{ if(btn) btn.classList.add('mic-active'); if(status) status.style.display = 'flex'; };
    meetingRecognition.onresult = (e)=>{
      let transcript = '';
      for(let i=0;i<e.results.length;i++){ transcript += e.results[i][0].transcript; }
      const input = document.getElementById('meetingInput');
      if(input) input.value = transcript;
    };
    meetingRecognition.onerror = (e)=>{
      toast(e.error==='not-allowed' ? 'يرجى السماح باستخدام الميكروفون من إعدادات المتصفح' : 'تعذر التعرف على الصوت، حاول مجدداً');
    };
    meetingRecognition.onend = ()=>{
      if(btn) btn.classList.remove('mic-active');
      if(status) status.style.display = 'none';
      meetingRecognition = null;
    };
    meetingRecognition.start();
  }catch(err){
    toast('تعذر تشغيل الإدخال الصوتي على هذا المتصفح');
    meetingRecognition = null;
  }
}

  const temp = { id:'pending-'+(automationUidCounter++), decisionId:d.id, title:d.title, changes:[d.steps[0]], expected:d.impactLabel, risk:d.risk, reversible:true,
    perms:['تعديل البيانات المرتبطة'], status:'قيد التنفيذ', when:'الآن', result:'بدأ التنفيذ للتو — القياس جارٍ' };
  AUTOMATIONS.unshift(temp);
  closeModal(); toast('بدأ التنفيذ الآلي — سيصلك تحديث بالنتيجة'); router();
  api('/api/automations/confirm', {method:'POST', body:{decisionId:id}}).then(res=>{
    if(res.automation){ temp.id = res.automation.id; }
  }).catch(err=>{
    d.status = prevStatus;
    const i = AUTOMATIONS.indexOf(temp); if(i>-1) AUTOMATIONS.splice(i,1);
    toast('تعذّر بدء التنفيذ الآلي — حاول مرة أخرى'); router();
  });
}

function matchIntegrations(q){
  const n = (q||'').trim().toLowerCase();
  if(!n) return [];
  return INTEGRATIONS.filter(i=>{
    const hay = [i.name, i.cat, ...(i.aliases||[])].join(' ').toLowerCase();
    return hay.includes(n);
  });
}

function integrationResultsHtml(q){
  const n = (q||'').trim();
  if(!n){
    return `<div class="card empty">اكتب اسم أي منصة أعلاه — مثل سلة، زد، أودو، أو واتساب — لعرض حالة الربط معها وشرح خطوات التوصيل.</div>`;
  }
  const results = matchIntegrations(n);
  if(!results.length){
    return `<div class="card empty">لم نجد منصة مطابقة لـ «${n}» ضمن التكاملات المتاحة حالياً.</div>`;
  }
  return results.map(integrationCard).join('');
}

  const box = document.getElementById('integrationResults');

}

function confirmDeleteCell(id){
  const c = CELL(id);
  if(!c || !isCustomCell(id)){ toast('هذه الخلية ثابتة ولا يمكن حذفها'); return; }
  const taskCount = CELL_TASKS.filter(t=>t.cellId===id).length;
  openModal(`
    <div style="font-weight:700;font-size:16px;margin-bottom:10px">حذف ${c.name}؟</div>

    </div>
  `);
}
function deleteCellConfirmed(id){
  const c = CELL(id);
  if(!c || !isCustomCell(id)) return;
  const name = c.name;
  const idx = CELLS.findIndex(x=>x.id===id);
  if(idx>-1) CELLS.splice(idx,1);
  for(let i=CELL_TASKS.length-1;i>=0;i--){ if(CELL_TASKS[i].cellId===id) CELL_TASKS.splice(i,1); }
  delete STATE.meeting.participants[id];
  for(let i=ACTIVITY_FEED.length-1;i>=0;i--){ if(ACTIVITY_FEED[i].cellId===id) ACTIVITY_FEED.splice(i,1); }
  closeModal();
  toast('تم حذف ' + name);
  if(currentHash()==='#cells/'+id) location.hash = '#tasks';
  else router();
}

function renderReports(){

      </div>
      <div class="card card-pad">
        <div class="section-title"><span>المظهر</span></div>

        </label>

      <div class="grid g-2" style="gap:8px">
        ${AI_RULES.map(r=>`<div style="display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.7">

/* ---------------- نافذة تفاصيل القرار ---------------- */
function openModal(html){
  STATE.modal = html;
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-wrap" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-head"><div></div><button class="modal-close" onclick="closeModal()">${icon('close')}</button></div>
        <div class="modal-body">${html}</div>
      </div>
    </div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; STATE.modal=null; }
function openDecisionModal(id){
  const d = DECISION(id); const c = CELL(d.cellId);
  openModal(`
    <div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:4px">
      <div class="avatar-cell" style="background:var(--${c.color}-soft);color:var(--${c.color})">${icon(c.icon)}</div>
      <div style="flex:1">
        <div style="font-weight:700;font-size:16px;line-height:1.5">${d.title}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:3px">${c.name} · ${d.date}</div>
      </div>
      ${priorityChip(d.category)}
    </div>
    <div class="divider"></div>
    <p style="font-size:13px;line-height:1.9;color:var(--text-2);margin-bottom:12px">${d.desc}</p>
    <div style="font-size:12.5px;margin-bottom:12px"><b>سبب القرار:</b> <span style="color:var(--text-2)">${d.reason}</span></div>
    <div style="margin-bottom:12px"><div style="font-size:12px;color:var(--muted);margin-bottom:5px">الأدلة</div>
      <ul style="margin:0;padding-inline-start:18px;font-size:12.5px;color:var(--text-2);line-height:1.9">${d.evidence.map(e=>`<li>${e}</li>`).join('')}</ul></div>
    <div class="grid g-3" style="gap:8px;margin-bottom:12px">
      <div><div style="font-size:11px;color:var(--muted)">الأثر المالي</div><div class="num" style="font-size:13px;font-weight:700;color:${d.impact>=0?'var(--good-strong)':'var(--risk-strong)'}">${d.impactLabel}</div></div>
      <div><div style="font-size:11px;color:var(--muted)">نسبة الثقة</div><div class="num" style="font-size:13px;font-weight:700">${d.confidence}%</div></div>
      <div><div style="font-size:11px;color:var(--muted)">المخاطرة</div><div style="font-size:13px;font-weight:700">${d.risk}</div></div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">
      ${d.support.map(id=>`<span class="chip chip-good" style="padding:3px 8px;font-size:10.5px">${icon('check')} ${CELL(id).name} مؤيدة</span>`).join('')}
      ${d.oppose.map(id=>`<span class="chip chip-risk" style="padding:3px 8px;font-size:10.5px">${icon('close')} ${CELL(id).name} معارضة</span>`).join('')}
    </div>
    <div style="margin-bottom:14px"><div style="font-size:12px;color:var(--muted);margin-bottom:5px">خطوات التنفيذ المقترحة</div>
      <ol style="margin:0;padding-inline-start:18px;font-size:12.5px;color:var(--text-2);line-height:2">${d.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>
    ${d.resultNote? `<div class="card card-pad" style="background:var(--surface-2);margin-bottom:14px"><b style="font-size:12.5px">النتيجة الفعلية:</b> <span style="font-size:12.5px;color:var(--text-2)">${d.resultNote}</span></div>`:''}
    <div class="divider"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <span class="chip ${STATUS_META[d.status].chip}">${d.status}</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="closeModal();sendToCouncil('${d.id}')">${icon('council')} للمجلس</button>
        <button class="btn btn-risk btn-sm" onclick="updateDecisionStatus('${d.id}','مرفوض');closeModal()">رفض</button>
        <button class="btn btn-ghost btn-sm" onclick="toast('تم فتح نموذج تعديل القرار')">تعديل</button>
        <button class="btn btn-good btn-sm" onclick="updateDecisionStatus('${d.id}','قيد التنفيذ');closeModal()">${icon('check')} موافقة وتنفيذ</button>

}

/* ---------------- التوجيه (Router) ---------------- */
const ROUTES = {
  '#overview': renderOverview, '#leader': renderLeader, '#council': renderCouncil, '#meeting': renderMeeting, '#decisions': renderDecisions,
  '#cells': renderCellsGrid, '#automation': renderAutomation, '#integrations': renderIntegrations,
  '#tasks': renderTasks, '#reports': renderReports, '#settings': renderSettings,
};
function router(){
  const hash = currentHash();
  renderSidebar();
  const view = document.getElementById('view');
  if(hash.startsWith('#cells/')){
    view.innerHTML = renderCellDetail(hash.split('/')[1]);
  } else if(ROUTES[hash]){
    view.innerHTML = ROUTES[hash]();
  } else {
    view.innerHTML = renderOverview();
  }
  if(hash==='#council' && STATE.councilPreset){
    const q = STATE.councilPreset; STATE.councilPreset = null;
    studyDecision(q);
  }
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo({top:0});
}
window.addEventListener('hashchange', router);

/* ---------------- التمهيد ---------------- */
async function boot(){
  applyTheme();
  try{
    await loadStateFromServer();
  }catch(err){
    if(err && err.message==='unauthorized') return; // api() already redirected to /login
    const view = document.getElementById('view');
    if(view) view.innerHTML = '<div class="card card-pad" style="margin:60px auto;max-width:480px;text-align:center;font-size:13px;line-height:1.9">تعذّر تحميل بيانات المتجر. تحقق من اتصالك ثم أعد تحميل الصفحة.</div>';
    console.error(err);
    return;
  }
  renderTopbar();
  router();
  window.addEventListener('resize', ()=>{ document.getElementById('menuBtn').style.display = window.innerWidth<=880?'flex':'none'; });
  document.getElementById('menuBtn') && (document.getElementById('menuBtn').style.display = window.innerWidth<=880?'flex':'none');
}
boot();
</script>
